version: 2

updates:
  # -------------------------------------------------------
  # Node.js / npm dependencies
  # -------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Dhaka"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "npm"

    commit-message:
      prefix: "deps"
      include: "scope"

    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "express"
          - "mongoose"
          - "@upstash/redis"
          - "bullmq"
          - "socket.io"
          - "jsonwebtoken"
          - "bcryptjs"
          - "helmet"
          - "cors"
          - "zod"
          - "express-validator"
          - "pino"
          - "pino-pretty"
          - "express-rate-limit"
          - "axios"
          - "@imagekit/nodejs"
          - "uuid"

      development-dependencies:
        dependency-type: "development"
        patterns:
          - "nodemon"
          - "dotenv"
          - "jest"
          - "supertest"
          - "mongodb-memory-server"

    versioning-strategy: increase

    cooldown:
      default-days: 3

    ignore:
      - dependency-name: "pino"
        versions: [">=11.0.0"]
        update-types: ["version-update:semver-major"]

  # -------------------------------------------------------
  # GitHub Actions dependencies
  # -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Dhaka"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"
      include: "scope"

    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
