name: CD - Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x

jobs:
  safety-check:
    name: Production Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify syntax
        run: node --check server.js && node --check worker.js

  deploy:
    name: Trigger Production Deployment
    needs: safety-check
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://api.hoterstellar.com

    steps:
      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "PRODUCTION_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"

      - name: Deployment triggered
        run: echo "Production deployment webhook triggered successfully."
