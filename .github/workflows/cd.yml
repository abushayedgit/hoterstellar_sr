name: CD - Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: 22.x

jobs:
  test:
    name: Production Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

  build-check:
    name: Build Verification
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify imports
        run: node --check server.js && node --check worker.js

      - name: Verify environment
        run: |
          if [ ! -f .env.example ]; then
            echo ".env.example not found"
            exit 1
          fi
          echo "Environment template present"

  deploy:
    name: Trigger Production Deployment
    needs: build-check
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "PRODUCTION_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"

      - name: Deployment triggered
        run: echo "Production deployment webhook triggered successfully."
