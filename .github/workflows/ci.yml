name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Security audit
        if: matrix.node-version == '22.x'
        run: npm audit --audit-level=high

  syntax-check:
    name: Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Verify server entry
        run: node --check server.js

      - name: Verify worker entry
        run: node --check worker.js

      - name: Verify app bootstrap
        run: node --check src/app/app.js

      - name: Verify config files
        run: |
          for file in src/config/*.js; do
            node --check "$file"
          done

      - name: Verify middleware files
        run: |
          for file in src/middlewares/*.js; do
            node --check "$file"
          done

      - name: Verify utility files
        run: |
          for file in src/utils/*.js; do
            node --check "$file"
          done

      - name: Verify environment template
        run: |
          if [ ! -f .env.example ]; then
            echo ".env.example not found"
            exit 1
          fi
          echo "Environment template present"
